server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API is same-origin (VITE_API_BASE=/api). Forward /api/... unchanged so it
    # matches Hono's basePath("/api"). `api` resolves on the compose network.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # nginx-only liveness. Deliberately does not touch the api, so the deploy gate can
    # tell "web image is broken" apart from "api image is broken".
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # External health visibility (uptime-kuma can hit https://wallet.…/health).
    location = /health {
        proxy_pass http://api:3000/health;
    }

    # Database/migration readiness remains separate from process liveness.
    location = /health/ready {
        proxy_pass http://api:3000/health/ready;
    }

    # SPA client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
