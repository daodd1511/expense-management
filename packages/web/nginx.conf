server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API is same-origin (VITE_API_BASE=/api). Forward /api/... unchanged so it
    # matches Hono's basePath("/api"). `api` resolves on the compose network.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # External health visibility (uptime-kuma can hit https://wallet.…/health).
    location = /health {
        proxy_pass http://api:3000/health;
    }

    # SPA client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
