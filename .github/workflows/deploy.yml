name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_API_BASE: /api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build API
        run: pnpm --filter @wallet/api build

      - name: Build Web
        run: |
          export APP_COMMIT="$(git rev-parse --short HEAD)"
          export APP_COMMIT_DATE="$(git log -1 --format=%cd --date=short)"
          pnpm build

      - name: Package deploy artifact
        run: |
          mkdir -p deploy/api deploy/web
          cp packages/api/dist/index.js deploy/api/index.js
          cp -R packages/web/dist/. deploy/web/
          cp scripts/deploy.sh deploy/deploy.sh
          tar -czf deploy.tar.gz -C deploy .

      - name: Upload artifact to VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          source: deploy.tar.gz
          target: /tmp

      - name: Deploy on VPS
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            set -e
            rm -rf /tmp/wallet-deploy
            mkdir -p /tmp/wallet-deploy
            tar -xzf /tmp/deploy.tar.gz -C /tmp/wallet-deploy
            bash /tmp/wallet-deploy/deploy.sh "${{ github.sha }}"
