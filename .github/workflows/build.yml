name: build

# Public repo. NO self-hosted runner is ever registered here — a fork PR would
# execute on the server. This job only builds images and pushes them to GHCR, then
# asks daodd1511/deploy (private, where the runner lives) to roll them out.
#
# Gated on CI: this runs only after the CI workflow completes successfully for a
# push to main. A red or in-progress CI never publishes images. Manual runs
# (workflow_dispatch) bypass the gate and build the current main HEAD.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

# The commit to build. Under workflow_run, github.sha is main's HEAD at trigger
# time — which may be newer than the commit CI tested — so pin to the triggering
# run's head_sha. workflow_dispatch has no workflow_run context, so fall back to
# github.sha (the ref the run was dispatched from).
env:
  BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

# One publish at a time; never cancel a half-pushed set of images.
concurrency:
  group: build-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Proceed only for a successful CI run on a push to main. workflow_run also fires
  # for PR CI completions and for failed/cancelled runs — those must not publish.
  gate:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    steps:
      - run: echo "CI green on main (${BUILD_SHA}); building"

  api:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/daodd1511/wallet-api:${{ env.BUILD_SHA }}
            ghcr.io/daodd1511/wallet-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  web:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The browser image receives only the same-origin API path and public build metadata.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_BASE=/api
            APP_COMMIT=${{ env.BUILD_SHA }}
          tags: |
            ghcr.io/daodd1511/wallet-web:${{ env.BUILD_SHA }}
            ghcr.io/daodd1511/wallet-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  dispatch:
    needs: [api, web]
    runs-on: ubuntu-latest
    # Forks that push to their own main must not poke the deploy repo.
    if: github.repository == 'daodd1511/expense-management'
    # A deploy-side outage should never mark a successful publish as failed.
    continue-on-error: true
    steps:
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
        run: |
          gh api repos/daodd1511/deploy/dispatches \
            -f event_type=deploy \
            -f 'client_payload[app]=wallet' \
            -f 'client_payload[tag]=${{ env.BUILD_SHA }}'
