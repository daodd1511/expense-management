name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wallet_test
          POSTGRES_USER: wallet_admin
          POSTGRES_PASSWORD: wallet-ci-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallet_admin -d wallet_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age
      - run: pnpm typecheck
      - name: Test against PostgreSQL 17
        env:
          TEST_DATABASE_URL: postgres://wallet_admin:wallet-ci-admin@127.0.0.1:5432/wallet_test?sslmode=disable
          TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: pnpm test
      - name: Build public wallet-ops image
        run: |
          docker build --file tools/ops/Dockerfile --tag wallet-ops:test .
          docker run --rm wallet-ops:test help

# Deploying is not this workflow's job. When this workflow succeeds on a push to
# main, build.yml (workflow_run-triggered) publishes images to GHCR and dispatches
# daodd1511/deploy — the private repo where the self-hosted runner lives. A red run
# here blocks the build. No runner is registered here.
