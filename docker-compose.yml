# LOCAL / MANUAL RUNS ONLY. Production orchestration lives in the private deploy repo.
# Values come from a local, gitignored `.env`; no credential is built into an image.
x-wallet-ops: &wallet-ops
  build:
    context: .
    dockerfile: tools/ops/Dockerfile
  image: wallet-ops:local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wallet}
      POSTGRES_USER: wallet_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - wallet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_admin -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [wallet]

  role-bootstrap:
    <<: *wallet-ops
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-wallet}
      PGUSER: wallet_admin
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      WALLET_MIGRATOR_PASSWORD: ${WALLET_MIGRATOR_PASSWORD:?set WALLET_MIGRATOR_PASSWORD in .env}
      WALLET_APP_PASSWORD: ${WALLET_APP_PASSWORD:?set WALLET_APP_PASSWORD in .env}
      WALLET_AUTH_PASSWORD: ${WALLET_AUTH_PASSWORD:?set WALLET_AUTH_PASSWORD in .env}
      WALLET_RECOVERY_PASSWORD: ${WALLET_RECOVERY_PASSWORD:?set WALLET_RECOVERY_PASSWORD in .env}
    command: ["bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [wallet]

  migrator:
    <<: *wallet-ops
    environment:
      DATABASE_URL: postgres://wallet_migrator:${WALLET_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB:-wallet}?sslmode=disable
    command: ["migrate"]
    depends_on:
      role-bootstrap:
        condition: service_completed_successfully
    restart: "no"
    networks: [wallet]

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: wallet-api:local
    pull_policy: build
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_DATABASE_URL: postgres://wallet_app:${WALLET_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-wallet}?sslmode=disable
      AUTH_DATABASE_URL: postgres://wallet_auth:${WALLET_AUTH_PASSWORD}@postgres:5432/${POSTGRES_DB:-wallet}?sslmode=disable
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      AUTH_TRUSTED_PROXY_IPS: ${AUTH_TRUSTED_PROXY_IPS:-172.30.0.20}
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [wallet]

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        VITE_API_BASE: /api
        APP_COMMIT: ${APP_COMMIT:-}
    image: wallet-web:local
    pull_policy: build
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      wallet:
        ipv4_address: 172.30.0.20

  recovery:
    <<: *wallet-ops
    profiles: ["recovery"]
    environment:
      DATABASE_URL: postgres://wallet_recovery:${WALLET_RECOVERY_PASSWORD}@postgres:5432/${POSTGRES_DB:-wallet}?sslmode=disable
      AGE_RECIPIENT: ${AGE_RECIPIENT:?set AGE_RECIPIENT in .env}
      ARCHIVE_DIR: /archives
    command: ["archive"]
    volumes:
      - wallet-recovery:/archives
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: "no"
    networks: [wallet]

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks: [wallet]

networks:
  wallet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  wallet-postgres:
  wallet-recovery:
