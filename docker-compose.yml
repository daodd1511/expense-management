# LOCAL / MANUAL RUNS ONLY — this builds from source and is not what production uses.
#
# Production compose lives in the private daodd1511/deploy repo at apps/wallet/compose.yml:
# pulled GHCR images (`ghcr.io/daodd1511/wallet-{web,api}:<sha>`), health-gated, with
# rollback. Images are published by .github/workflows/build.yml on push to main.
#
# Values here come from a local, gitignored `.env` (see .env.example).
services:
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: wallet-api:local
    pull_policy: build
    environment:
      NODE_ENV: production
      PORT: "3000"
      SUPABASE_URL: ${VITE_SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
    restart: unless-stopped
    networks: [wallet]

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_API_BASE: /api
        APP_COMMIT: ${APP_COMMIT:-}
    image: wallet-web:local
    pull_policy: build
    depends_on: [api]
    restart: unless-stopped
    networks: [wallet]

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    restart: unless-stopped
    networks: [wallet]

networks:
  wallet:
    driver: bridge
